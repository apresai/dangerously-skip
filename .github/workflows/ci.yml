name: CI
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Same build and guard as deploy.yml; see the notes there. The CDK tests
      # synthesize NextjsSite, which reads the OpenNext output from disk.
      - run: npm_config_userconfig=/dev/null npm_config_allow_scripts= npx open-next build
      - run: node scripts/assert-sharp-bundle.mjs .open-next/image-optimization-function
      - working-directory: cdk
        run: npm ci
      - working-directory: cdk
        run: npx tsc --noEmit
      - working-directory: cdk
        run: npm test
