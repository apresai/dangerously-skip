name: Deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The npm_config_userconfig guard keeps the inner `npm install` that
      # OpenNext runs for the image optimization bundle from picking up a user
      # npmrc. It is a no-op on this runner today (setup-node writes no auth
      # npmrc without registry-url) and is kept so CI and `make deploy` run the
      # exact same command. Lowercase deliberately: see the note in the Makefile.
      #
      # The load-bearing half of this fix on CI is open-next.config.ts, not the
      # prefix: ubuntu-latest is x64, npm defaults --cpu to the host, and the
      # image optimizer Lambda is ARM_64, so without --cpu=arm64 a CI build
      # produces the wrong binary.
      - run: npm_config_userconfig=/dev/null npm_config_allow_scripts= npx open-next build
      # installDeps.js swallows a failed inner install, so open-next build exits
      # 0 with a sharp-less bundle. Fail loudly instead of deploying that.
      - run: test -f .open-next/image-optimization-function/node_modules/@img/sharp-linux-arm64/lib/sharp-linux-arm64.node
      - working-directory: cdk
        run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - working-directory: cdk
        run: npx cdk deploy DangerouslySkipStack --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
