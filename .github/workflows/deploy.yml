name: Deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # NPM_CONFIG_USERCONFIG=/dev/null keeps the inner `npm install` that
      # OpenNext runs for the image optimization bundle from picking up a user
      # npmrc. It is a no-op on this runner today (setup-node writes no auth
      # npmrc without registry-url) and is kept so CI and `make deploy` run the
      # exact same command.
      - run: NPM_CONFIG_USERCONFIG=/dev/null npx open-next build
      - working-directory: cdk
        run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - working-directory: cdk
        run: npx cdk deploy DangerouslySkipStack --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
